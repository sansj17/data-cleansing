<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier ER Diagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* personal_design_system tokens: Mocha (dark), always */
    :root {
      --base: #1e1e2e; --surface: #313244; --border: #7f849c;
      --text: #cdd6f4; --subtext: #a6adc8; --accent: #89b4fa;
      --font-mono: "Cousine Nerd Font Mono", "Courier New", monospace;
    }
    body {
      font-family: var(--font-mono); background: var(--base); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--subtext); margin-bottom: 8px; }
    h1 { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--text); margin-bottom: 24px; }
    svg { width: 100%; min-width: 960px; display: block; }
    svg text { font-family: var(--font-mono); }
    .bg { fill: var(--base); }
    .box { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .box.focal { stroke: var(--accent); }
    .tint { fill: var(--accent); fill-opacity: 0.08; }
    .hdr { stroke: var(--border); stroke-width: 1; opacity: 0.6; }
    .hdr.focal { stroke: var(--accent); }
    .tag { fill: none; stroke: var(--border); stroke-width: 0.8; }
    .tag.focal { stroke: var(--accent); }
    .tagt { font-size: 9px; fill: var(--subtext); }
    .tagt.focal { fill: var(--accent); }
    .name { font-size: 14px; font-weight: 700; fill: var(--text); }
    .fld { font-size: 10px; fill: var(--text); }
    .sub { font-size: 10px; fill: var(--subtext); }
    .rel { stroke: var(--subtext); stroke-width: 1.2; stroke-dasharray: 5,4; }
    .mask { fill: var(--base); }
    .lab { font-size: 8px; letter-spacing: 0.08em; fill: var(--subtext); }
    .card { font-size: 10px; font-weight: 700; fill: var(--text); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / data model · suppliers.duckdb</p>
    <h1>Vendors, purchase orders and invoices</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
        <title id="er-title">Supplier ER diagram</title>
        <desc id="er-desc">Three legacy tables: each vendor has many purchase orders, and each purchase order has many invoices, linked by implied keys.</desc>
        <rect width="100%" height="100%" class="bg"/>
<line x1="260" y1="130" x2="380" y2="130" class="rel"/>
<rect x="290.0" y="110" width="60" height="14" class="mask"/>
<text x="320.0" y="120" text-anchor="middle" class="lab">VENDOR_ID</text>
<text x="272" y="124" text-anchor="middle" class="card">1</text>
<text x="368" y="124" text-anchor="middle" class="card">N</text>
<line x1="600" y1="130" x2="720" y2="130" class="rel"/>
<rect x="630.0" y="110" width="60" height="14" class="mask"/>
<text x="660.0" y="120" text-anchor="middle" class="lab">PO_ID</text>
<text x="612" y="124" text-anchor="middle" class="card">1</text>
<text x="708" y="124" text-anchor="middle" class="card">N</text>
<rect x="40" y="60" width="220" height="204" rx="8" class="box focal"/>
<rect x="40" y="60" width="220" height="204" rx="8" class="tint"/>
<line x1="40" y1="104" x2="260" y2="104" class="hdr focal"/>
<rect x="52" y="68" width="50" height="14" rx="4" class="tag focal"/><text x="77" y="78" text-anchor="middle" class="tagt focal">vendors</text>
<text x="248" y="78" text-anchor="end" class="sub">200 rows</text>
<text x="52" y="97" class="name">Vendor</text>
<text x="52" y="122" class="sub">#</text><text x="66" y="122" class="fld">vendor_id</text><text x="248" y="122" text-anchor="end" class="sub">INTEGER</text>
<text x="52" y="140" class="sub"></text><text x="66" y="140" class="fld">vendor_name</text><text x="248" y="140" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="158" class="sub"></text><text x="66" y="158" class="fld">tax_id</text><text x="248" y="158" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="176" class="sub"></text><text x="66" y="176" class="fld">country</text><text x="248" y="176" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="194" class="sub"></text><text x="66" y="194" class="fld">email</text><text x="248" y="194" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="212" class="sub"></text><text x="66" y="212" class="fld">payment_terms</text><text x="248" y="212" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="230" class="sub"></text><text x="66" y="230" class="fld">status</text><text x="248" y="230" text-anchor="end" class="sub">VARCHAR</text>
<text x="52" y="248" class="sub"></text><text x="66" y="248" class="fld">created_date</text><text x="248" y="248" text-anchor="end" class="sub">VARCHAR</text>
<rect x="380" y="60" width="220" height="150" rx="8" class="box"/>
<line x1="380" y1="104" x2="600" y2="104" class="hdr "/>
<rect x="392" y="68" width="93" height="14" rx="4" class="tag "/><text x="438" y="78" text-anchor="middle" class="tagt ">purchase_orders</text>
<text x="588" y="78" text-anchor="end" class="sub">800 rows</text>
<text x="392" y="97" class="name">Purchase order</text>
<text x="392" y="122" class="sub">#</text><text x="406" y="122" class="fld">po_id</text><text x="588" y="122" text-anchor="end" class="sub">INTEGER</text>
<text x="392" y="140" class="sub">→</text><text x="406" y="140" class="fld">vendor_id</text><text x="588" y="140" text-anchor="end" class="sub">INTEGER</text>
<text x="392" y="158" class="sub"></text><text x="406" y="158" class="fld">po_date</text><text x="588" y="158" text-anchor="end" class="sub">DATE</text>
<text x="392" y="176" class="sub"></text><text x="406" y="176" class="fld">amount</text><text x="588" y="176" text-anchor="end" class="sub">DECIMAL(12,2)</text>
<text x="392" y="194" class="sub"></text><text x="406" y="194" class="fld">currency</text><text x="588" y="194" text-anchor="end" class="sub">VARCHAR</text>
<rect x="720" y="60" width="220" height="150" rx="8" class="box"/>
<line x1="720" y1="104" x2="940" y2="104" class="hdr "/>
<rect x="732" y="68" width="55" height="14" rx="4" class="tag "/><text x="760" y="78" text-anchor="middle" class="tagt ">invoices</text>
<text x="928" y="78" text-anchor="end" class="sub">1,500 rows</text>
<text x="732" y="97" class="name">Invoice</text>
<text x="732" y="122" class="sub">#</text><text x="746" y="122" class="fld">invoice_id</text><text x="928" y="122" text-anchor="end" class="sub">INTEGER</text>
<text x="732" y="140" class="sub">→</text><text x="746" y="140" class="fld">po_id</text><text x="928" y="140" text-anchor="end" class="sub">INTEGER</text>
<text x="732" y="158" class="sub"></text><text x="746" y="158" class="fld">invoice_date</text><text x="928" y="158" text-anchor="end" class="sub">DATE</text>
<text x="732" y="176" class="sub"></text><text x="746" y="176" class="fld">amount</text><text x="928" y="176" text-anchor="end" class="sub">DECIMAL(12,2)</text>
<text x="732" y="194" class="sub"></text><text x="746" y="194" class="fld">paid</text><text x="928" y="194" text-anchor="end" class="sub">BOOLEAN</text>
<line x1="40" y1="318" x2="920" y2="318" class="hdr"/>
<text x="40" y="340" class="sub"># primary key    → foreign key (implied)    - - - relationship not enforced: no foreign keys declared</text>

      </svg>
    </div>
  </div>
</body>
</html>
